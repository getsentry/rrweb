name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Lint and Measure Bundle Sizes

    steps:
      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout current branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Build Packages
        run: NODE_OPTIONS='--max-old-space-size=4096' pnpm run build:all
      - name: Lint
        run: pnpm run lint
      - name: Measure PR bundle sizes
        if: github.event_name == 'pull_request'
        run: node .github/scripts/measure-bundle-sizes.js pr-sizes.json
      - name: Upload PR bundle sizes
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-sizes
          path: pr-sizes.json

  bundle_size_build:
    # Only runs on PRs. Reuses the PR build from lint job (via the
    # pr-sizes artifact) and only builds the base branch itself. The privileged
    # bundle-size-comment workflow then posts the PR comment without ever
    # executing fork code.
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    name: Build Base for Bundle Size Comparison
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
      - name: Prepare bundle size helper
        run: |
          cp .github/scripts/measure-bundle-sizes.js /tmp/measure-bundle-sizes.js
      # --- Base branch ---
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      - name: Download PR bundle sizes
        uses: actions/download-artifact@v4
        with:
          name: pr-sizes
      # The base branch can still be on yarn while a package manager change is in review.
      - name: Detect base package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"; else echo "name=yarn" >> "$GITHUB_OUTPUT"; fi
      - name: Install pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: ${{ steps.pm.outputs.name }}
      - name: Install base dependencies
        run: ${{ steps.pm.outputs.name }} install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Build base branch
        run: NODE_OPTIONS='--max-old-space-size=4096' ${{ steps.pm.outputs.name }} run build:all
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Measure base bundle sizes
        run: node /tmp/measure-bundle-sizes.js base-sizes.json

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-size-data
          path: |
            pr-sizes.json
            base-sizes.json
